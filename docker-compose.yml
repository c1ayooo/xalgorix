# Xalgorix — one-command run. Publishes the dashboard on http://localhost:9137
# and persists all data (scans, reports, and settings) to a named volume.
#
#   docker compose up -d
#   docker compose logs -f      # shows the generated admin password on first run
#
# You do NOT need an LLM key to start — the dashboard launches without one and
# you can configure the model + API key under Settings → LLM (it persists to the
# volume). Set the env vars below only if you'd rather bake them in.
#
# ── Deployment shapes ────────────────────────────────────────────────────────
# Default = all-in-one (unchanged): platform + full toolset in one privileged
# container, tools executed natively (XALGORIX_RUNTIME_BACKEND=native). It has
# no profile, so a bare `docker compose up -d` keeps working for existing users.
#
# Split = slim control plane + per-project toolbox containers + host-side
# runnerd. It lives in the opt-in `split` profile. `allinone` is the implicit
# default shape, so `--profile allinone` is accepted as a synonym for it.
# Compose always starts services without a profile, so name the split platform
# explicitly to avoid also starting the all-in-one service:
#
#   XALGORIX_TOOLBOX_IMAGE=repo@sha256:<64hex> XALGORIX_TOOLBOX_PROXY_URL=... \
#     docker compose --profile split up -d xalgorix-split
#
# Split prerequisites: a digest-pinned toolbox image (the platform refuses tag
# references unless XALGORIX_ALLOW_UNPINNED_TOOLBOX=1), and a proxy URL that is
# reachable from the per-project network — docker-backend tools fail closed
# without it. This profile starts its own PostgreSQL.
services:
  xalgorix:
    image: c1ayooo/xalgorix:latest
    # Or build locally instead of pulling:  build: .
    depends_on:
      db:
        condition: service_healthy
    #
    # Full host-like permissions so the engine's toolset behaves as it does when
    # run natively as root. Docker's DEFAULT sandbox drops capabilities
    # (e.g. NET_ADMIN) and applies a seccomp/AppArmor filter, which breaks
    # low-level tools: iptables/route/interface changes, ARP-spoof/MITM
    # (ettercap/bettercap), tun/tap VPNs, ptrace-based debuggers (gdb/strace),
    # masscan interface tuning, and tools that create their own namespaces.
    #
    # NOTE: an image cannot grant itself these — they MUST be set at run time.
    # This compose file is the recommended launch path precisely so you get them
    # by default with no extra flags. The container is meant to be a disposable,
    # network-isolated scanning sandbox running as root; privileged mode is the
    # intended posture. Never expose the dashboard publicly without auth.
    privileged: true
    # ── Prefer least-privilege instead of `privileged: true`? Comment the line
    #    above and uncomment this targeted set (covers the pentest toolset while
    #    stopping short of full device access):
    # cap_add:
    #   - NET_ADMIN      # iptables/nftables, routes, interfaces, ARP/MITM, VPN
    #   - NET_RAW        # raw sockets / SYN scans (in Docker's default set too)
    #   - SYS_PTRACE     # gdb / strace / debug attach
    # security_opt:
    #   - seccomp=unconfined     # allow mount/unshare/bpf/perf_event_open/keyctl
    #   - apparmor=unconfined
    ports:
      - "9137:9137"
    environment:
      # PostgreSQL is a required deployment dependency (charter v3.0 / R6).
      XALGORIX_DATABASE_URL: ${XALGORIX_DATABASE_URL:-postgres://xalgorix:xalgorix@db:5432/xalgorix?sslmode=disable}
      # Uncomment to bake in credentials / LLM (all optional). If you omit the
      # login, a random admin password is generated and printed to the logs on
      # first start. The LLM can be set here or under Settings → LLM.
      # XALGORIX_USERNAME: admin
      # XALGORIX_PASSWORD: change-me-please
      # XALGORIX_LLM: openai/gpt-5.6
      # XALGORIX_API_KEY: your_provider_api_key
    #
    # Optional: run tool calls in per-project toolbox containers instead of in
    # this container. See deploy/docker-compose.yml for the transport choices;
    # native execution stays the default.
    #   XALGORIX_RUNTIME_BACKEND: docker
    #   XALGORIX_RUNTIME_TRANSPORT: runnerd
    #   XALGORIX_TOOLBOX_IMAGE: ghcr.io/c1ayooo/xalgorix-toolbox:VERSION-core@sha256:...
    volumes:
      - xalgorix-data:/data
      # - /run/xalgorix:/run/xalgorix   # runnerd transport
      # - /var/run/docker.sock:/var/run/docker.sock  # socket transport (dev only)
    restart: unless-stopped

  # ── Split shape (opt-in) ──────────────────────────────────────────────────
  # Slim platform: control plane only, no toolset, not privileged. It drives
  # per-project toolbox containers through runnerd and stores artifacts on a
  # host directory mounted at the SAME absolute path (required because the
  # platform hands scan paths to the daemon for bind mounts).
  xalgorix-split:
    profiles: ["split"]
    image: c1ayooo/xalgorix:${XALGORIX_SLIM_TAG:-slim}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      runnerd:
        condition: service_started
    environment:
      XALGORIX_DATABASE_URL: ${XALGORIX_DATABASE_URL:-postgres://xalgorix:xalgorix@db:5432/xalgorix?sslmode=disable}
      XALGORIX_DATA_DIR: ${XALGORIX_DATA_DIR:-/srv/xalgorix/data}
      # The platform runs in a container and hands scan paths to the daemon
      # verbatim; the host path must equal the container path.
      XALGORIX_HOST_DATA_DIR: ${XALGORIX_DATA_DIR:-/srv/xalgorix/data}
      XALGORIX_RUNTIME_BACKEND: docker
      XALGORIX_RUNTIME_TRANSPORT: runnerd
      XALGORIX_RUNNERD_SOCKET: /run/xalgorix/runner.sock
      # Must be digest-pinned (repo@sha256:<64hex>); tag references are refused.
      XALGORIX_TOOLBOX_IMAGE: ${XALGORIX_TOOLBOX_IMAGE:-}
      XALGORIX_TOOLBOX_PROFILE: ${XALGORIX_TOOLBOX_PROFILE:-core}
      # Opt-in: only overlay2 with project quotas honours StorageOpt; enabling
      # it on an unsupported daemon fails container creation.
      XALGORIX_PROJECT_DISK_ENFORCE: ${XALGORIX_PROJECT_DISK_ENFORCE:-0}
      # Reachable from the per-project network; the docker backend fails closed
      # when proxy is required and this is empty.
      XALGORIX_TOOLBOX_PROXY_URL: ${XALGORIX_TOOLBOX_PROXY_URL:-}
      # To let project containers use this platform's traffic proxy, bind it on
      # a project-network-reachable address and publish that port, e.g.
      #   XALGORIX_TRAFFICPROXY_BIND=0.0.0.0:8081
      #   XALGORIX_TRAFFICPROXY_ADVERTISE=host.docker.internal:8081
      #   XALGORIX_TOOLBOX_PROXY_URL=http://host.docker.internal:8081
      # Binding 0.0.0.0 exposes an intercepting proxy; firewall it and never
      # expose it beyond the host. Defaults keep it on loopback.
      # XALGORIX_TRAFFICPROXY_BIND: 0.0.0.0:8081
      # XALGORIX_TRAFFICPROXY_ADVERTISE: host.docker.internal:8081
    # Resolve the host from inside the platform container so the browser can
    # reach runnerd's CDP relay (Linux: host-gateway).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # 9138 by default so a stray `--profile split up` cannot collide with the
      # all-in-one service above; set XALGORIX_SPLIT_PORT=9137 if it is stopped.
      - "127.0.0.1:${XALGORIX_SPLIT_PORT:-9138}:9137"
    volumes:
      - ${XALGORIX_DATA_DIR:-/srv/xalgorix/data}:${XALGORIX_DATA_DIR:-/srv/xalgorix/data}
      - ${XALGORIX_RUNNERD_DIR:-/run/xalgorix}:/run/xalgorix

  # Host-side runtime service: owns docker.sock, exposes only the ensure/exec/
  # stop/remove/inspect/list/capacity operations over a unix socket. Build it
  # with `make image-runnerd` (Dockerfile target `runnerd`).
  runnerd:
    profiles: ["split"]
    image: ${XALGORIX_RUNNERD_IMAGE:-xalgorix-runnerd:dev}
    restart: unless-stopped
    # Linux only: host networking lets runnerd reach the host-published
    # Chromium DevTools port (127.0.0.1:<ephemeral>) and bind its relay on the
    # host. Without it the relay's upstream probe dials the runnerd container's
    # own loopback and the containerised browser cannot be reached.
    network_mode: host
    command: ["--socket", "/run/xalgorix/runner.sock"]
    environment:
      XALGORIX_TOOLBOX_IMAGE: ${XALGORIX_TOOLBOX_IMAGE:-}
      XALGORIX_TOOLBOX_PROFILE: ${XALGORIX_TOOLBOX_PROFILE:-core}
      XALGORIX_MAX_PROJECTS: ${XALGORIX_MAX_PROJECTS:-0}
      XALGORIX_TOOLBOX_CONCURRENCY: ${XALGORIX_TOOLBOX_CONCURRENCY:-4}
      XALGORIX_PROJECT_DISK_ENFORCE: ${XALGORIX_PROJECT_DISK_ENFORCE:-0}
      XALGORIX_RUNNERD_CDP_BIND: ${XALGORIX_RUNNERD_CDP_BIND:-0.0.0.0:0}
      XALGORIX_RUNNERD_CDP_ADVERTISE: ${XALGORIX_RUNNERD_CDP_ADVERTISE:-host.docker.internal}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${XALGORIX_RUNNERD_DIR:-/run/xalgorix}:/run/xalgorix
      - ${XALGORIX_DATA_DIR:-/srv/xalgorix/data}:${XALGORIX_DATA_DIR:-/srv/xalgorix/data}

  # PostgreSQL is required by every shape since charter v3.0 / R6. It is
  # unprofiled so a bare `docker compose up -d` starts it for the all-in-one
  # service as well; the split service shares the same instance.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xalgorix
      POSTGRES_PASSWORD: xalgorix
      POSTGRES_DB: xalgorix
    ports:
      - "127.0.0.1:${XALGORIX_SPLIT_PG_PORT:-5433}:5432"
    volumes:
      - xalgorix-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xalgorix -d xalgorix"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  xalgorix-data:
  xalgorix-pgdata:
