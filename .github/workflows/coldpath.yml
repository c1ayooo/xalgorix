name: Cold path (PostgreSQL)

on:
  pull_request:
    paths:
      - "internal/infoitem/**"
      - "internal/domainjournal/**"
      - "internal/coldpath/**"
      - "internal/jobs/**"
      - "internal/storage/**"
      - "cmd/xalgorix/**"
      - ".github/workflows/coldpath.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    name: InfoItem cold path
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xalgorix
          POSTGRES_PASSWORD: xalgorix
          POSTGRES_DB: xalgorix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xalgorix -d xalgorix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      XALGORIX_TEST_DATABASE_URL: postgres://xalgorix:xalgorix@127.0.0.1:5432/xalgorix_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true
      - name: Download modules
        run: go mod download
      - name: Cold-path tests
        run: go test -race -count=1 ./internal/infoitem/... ./internal/domainjournal ./internal/storage ./internal/jobs ./internal/coldpath
      - name: Cold-path vet
        run: go vet ./internal/infoitem/... ./internal/domainjournal ./internal/jobs ./internal/coldpath
