name: toolbox image

# Builds and verifies the per-project tool container image.
#
# The image is the execution plane for XALGORIX_RUNTIME_BACKEND=docker. It is
# published by digest, and the platform only accepts digest references, so the
# job prints the digest for the release notes.
#
# Cache-busting: TOOLS_REFRESH invalidates the tool-install layers (same contract
# as the main image's nuclei refresh) so a repeated build picks up new upstream
# tool releases without rebuilding the whole base.
#
# Tag convention (contract): <toolbox-repo>:<version>-<profile> for releases,
# <toolbox-repo>:<sha>-<profile> for every main-branch build. The platform pins
# the resulting digest (repo@sha256:<64hex>), never these tags.

on:
  push:
    branches: [main]
    # Path filters are not evaluated for tag pushes, so release tags always run.
    tags: ["v*"]
    paths:
      - 'tools/toolbox/**'
      - 'cmd/toolshim/**'
      - '.github/workflows/toolbox.yml'
  pull_request:
    paths:
      - 'tools/toolbox/**'
      - 'cmd/toolshim/**'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Image profile (core|full|web)'
        required: false
        default: 'core'

concurrency:
  group: toolbox-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ github.event.inputs.profile && fromJSON(format('["{0}"]', github.event.inputs.profile)) || fromJSON('["core","full","web"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.profile }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/toolbox/Dockerfile
          target: ${{ matrix.profile }}
          load: true
          tags: xalgorix-toolbox:${{ matrix.profile }}
          build-args: |
            TOOLS_REFRESH=${{ github.run_id }}
          cache-from: type=gha,scope=toolbox-${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=toolbox-${{ matrix.profile }}

      # Gate: the image must contain the tools its manifest claims. A failure here
      # blocks publishing — shipping an image whose tools are missing silently
      # degrades every scan, which is worse than no image.
      - name: Self-test ${{ matrix.profile }}
        run: |
          # Full-profile tools (nmap/masscan/gdb/strace) need the same
          # capabilities the platform grants; core/web ignore them.
          docker run --rm \
            --cap-add NET_RAW --cap-add NET_ADMIN --cap-add SYS_PTRACE \
            --entrypoint /opt/xalgorix/bin/toolbox-selftest \
            xalgorix-toolbox:${{ matrix.profile }} \
            --profile ${{ matrix.profile }} --json | tee selftest-${{ matrix.profile }}.json

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: xalgorix-toolbox:${{ matrix.profile }}
          artifact-name: sbom-${{ matrix.profile }}.spdx.json

      - name: Publish digest
        id: digest
        run: |
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' xalgorix-toolbox:${{ matrix.profile }} 2>/dev/null || true)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "image digest: ${digest}"

      - name: Push ${{ matrix.profile }}
        if: github.event_name != 'pull_request'
        run: |
          repo="ghcr.io/${{ github.repository_owner }}/xalgorix-toolbox"
          tags=("${repo}:${{ github.sha }}-${{ matrix.profile }}")
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${{ github.ref_name }}"
            tags+=("${repo}:${version#v}-${{ matrix.profile }}")
          fi
          for tag in "${tags[@]}"; do
            docker tag xalgorix-toolbox:${{ matrix.profile }} "${tag}"
            docker push "${tag}"
          done
          docker inspect --format='{{index .RepoDigests 0}}' "${tags[0]}"

      - uses: actions/upload-artifact@v4
        with:
          name: toolbox-selftest-${{ matrix.profile }}
          path: selftest-${{ matrix.profile }}.json
