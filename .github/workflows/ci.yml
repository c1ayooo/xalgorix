# GitHub Actions CI workflow for xalgorix.
#
# Every pull request runs `make lint`, the unit-test suite, and `go vet`.
# This file stays focused on the per-PR fast feedback loop.

name: CI

on:
  pull_request:
    branches:
      - main
      - master
      - "release/**"
  push:
    branches:
      - main
      - master
  # Allows re-running CI on demand. Needed when push/pull_request events are
  # dropped or never scheduled — e.g. during an Actions incident, which leaves a
  # merged commit on main with no coverage and no way to ask for a fresh run.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.11"
  GOLANGCI_LINT_VERSION: "v2.12.2"

jobs:
  lint:
    name: Lint (make lint + golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt + go vet (make lint)
        run: make lint

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --config .golangci.yml

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XALGORIX_REQUIRE_ORACLE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Set up application oracle runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application oracle dependencies
        run: python -m pip install -r internal/agent/testdata/oracle-requirements.txt

      - name: go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./... -race -count=1

      - name: Coverage report
        run: go test ./... -covermode=atomic -coverprofile=coverage.out

      - name: Enforce minimum coverage
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/{gsub(/%/,"",$3); print $3}')
          echo "total coverage: ${total}%"
          awk -v c="$total" 'BEGIN { if (c < 30) { print "coverage below 30% floor"; exit 1 } }'

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out
          retention-days: 7
          if-no-files-found: warn

  platform-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./cmd/xalgorix

  webui:
    name: WebUI typecheck + embed freshness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install locked dependencies
        run: cd webui && npm ci --no-audit --no-fund
      - name: Typecheck
        run: cd webui && npm run typecheck
      - name: Build embedded bundle
        run: cd webui && npm run build
      - name: Committed embed must match source
        run: git diff --exit-code -- internal/web/static

  deploy-validate:
    name: Docker Compose + Helm chart validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compose config
        run: docker compose -f docker-compose.yml config >/dev/null
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint deploy/chart
      - name: Helm template
        run: helm template xalgorix deploy/chart >/dev/null
      - name: Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
      - name: Validate Docker webui build stage
        run: docker build --target webui -t xalgorix-webui-ci .

  macos-smoke:
    name: macOS ARM64 smoke test
    # Runs on pull requests and manual dispatch, not on pushes to main/master.
    # Changes reach main only through a PR, which already ran this job. Hosted
    # macOS arm64 runners are often at capacity: a queued job that is never
    # picked up gets cancelled and turned main red without any code problem.
    if: github.event_name != 'push'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner architecture
        run: test "$(uname -m)" = arm64

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify native resource metrics
        run: go test ./internal/resources -count=1

      - name: Build native binary
        run: go build ./cmd/xalgorix
